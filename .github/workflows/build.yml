name: build

# This repository is source only: CI checks that the code builds and passes its tests. It never packages, uploads or
# publishes a compiled plugin (see NOTICE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each plugin lives in plugins/<name>/; for now there is one.
defaults:
  run:
    working-directory: plugins/themis

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The three jobs are independent and run in parallel: a failing unit test does not need the builds to wait for it.
jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: DSP unit tests
        run: make test

  macos:
    # Universal (arm64 + x86_64) VST3 + AU, the plugin formats for macOS.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DTHEMIS_INSTALL_AFTER_BUILD=ON
      - name: Build
        run: cmake --build build --config Release --target Themis_VST3 Themis_AU -j "$(sysctl -n hw.ncpu)"
      - name: Check architectures
        run: |
          lipo -info "$HOME/Library/Audio/Plug-Ins/VST3/Themis Verdict.vst3/Contents/MacOS/Themis Verdict"
          lipo -info "$HOME/Library/Audio/Plug-Ins/Components/Themis Verdict.component/Contents/MacOS/Themis Verdict"
      - name: Ad-hoc sign (required on Apple Silicon)
        run: |
          codesign --force --deep --sign - "$HOME/Library/Audio/Plug-Ins/VST3/Themis Verdict.vst3"
          codesign --force --deep --sign - "$HOME/Library/Audio/Plug-Ins/Components/Themis Verdict.component"
      - name: Validate Audio Unit
        continue-on-error: true # auval can be flaky on hosted runners; the result is still logged
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Thms Thmi

  linux-plugin-compile:
    # Catches plugin-layer compile errors on every push without needing a Mac, and runs the headless smoke test.
    # The VST3 and ThemisSmoke targets share one configure and one build: each target compiles its own JUCE, so the
    # two cost the same compiles either way, but one job saves a second checkout, apt install and JUCE fetch.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DTHEMIS_BUILD_TESTS=OFF -DTHEMIS_BUILD_SMOKE=ON -DTHEMIS_INSTALL_AFTER_BUILD=OFF
      - name: Build VST3 and smoke test
        run: cmake --build build --target Themis_VST3 ThemisSmoke -j "$(nproc)"
      # ThemisSmoke returns non-zero when any of its checks fails, which fails the job. Its PNGs go to a temporary folder
      # and are not uploaded: CI does not publish anything. Xvfb gives the editor a display on a runner without one.
      - name: Smoke test (headless processor and editor)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          xvfb-run -a build/ThemisSmoke_artefacts/Release/ThemisSmoke \
            "$RUNNER_TEMP/smoke/screenshot.png" "$RUNNER_TEMP/smoke/graphs.png" "$RUNNER_TEMP/smoke/hold.png"
