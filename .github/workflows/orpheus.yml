name: orpheus

# This repository is source only: CI checks that the code builds and passes its tests. It never packages, uploads or
# publishes a compiled app (see NOTICE.md). Orpheus' checks need JUCE, which CMake fetches (git + network); they run headless.
on:
  push:
    branches: [main]
    paths:
      - 'apps/orpheus/**'
      - 'shared/ui/**'
      - 'cmake/**'
      - '.github/workflows/orpheus.yml'
  pull_request:
    paths:
      - 'apps/orpheus/**'
      - 'shared/ui/**'
      - 'cmake/**'
      - '.github/workflows/orpheus.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/orpheus

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # The signal processing (OrpheusTests) and the session, player and window driven with synthetic events (OrpheusUiCheck), and the app itself must build.
    # No audio device and no display are needed. A macOS build is not covered here.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target OrpheusTests OrpheusUiCheck Orpheus -j 4
      - name: Signal processing tests
        run: ./build/OrpheusTests_artefacts/Release/OrpheusTests
      - name: Session, player and window check
        run: ./build/OrpheusUiCheck_artefacts/Release/OrpheusUiCheck
