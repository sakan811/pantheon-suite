name: codeql

# Static security analysis of the C++ sources (free for public repositories). Results appear under Security > Code
# scanning. It analyses the code that `make test` compiles (all of core/); it publishes nothing.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, picks up new queries
  workflow_dispatch:

permissions:
  contents: read

# Each plugin lives in plugins/<name>/; for now there is one.
defaults:
  run:
    working-directory: plugins/themis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build the code under analysis
        run: make test
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:c-cpp"
