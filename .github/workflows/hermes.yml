name: hermes

# This repository is source only: CI checks that the code builds and passes its tests. It never packages, uploads or
# publishes a compiled plugin (see NOTICE.md). Hermes' checks need JUCE, which CMake fetches (git + network); they run headless.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermes/**'
      - 'shared/**'
      - 'cmake/**'
      - '.github/workflows/hermes.yml'
  pull_request:
    paths:
      - 'plugins/hermes/**'
      - 'shared/**'
      - 'cmake/**'
      - '.github/workflows/hermes.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/hermes

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # The DSP tests (HermesTests) and the editor built on the real processor (HermesUiCheck). A macOS build, universal binaries,
    # a host check of the built VST3 and auval are not covered here.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target HermesTests HermesUiCheck Hermes_VST3 -j 4
      - name: DSP tests
        run: ./build/HermesTests_artefacts/Release/HermesTests
      - name: Editor check
        run: ./build/HermesUiCheck_artefacts/Release/HermesUiCheck
